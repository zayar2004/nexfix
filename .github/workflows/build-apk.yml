name: Build Android APK

on:
  push:
    branches: [test/capacitor-verify]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Capacitor Android
        run: |
          echo "Checking @capacitor/android..."
          ls -la node_modules/@capacitor/android || echo "❌ Not found"
          echo "Checking @capacitor/cli..."
          ls -la node_modules/@capacitor/cli || echo "❌ Not found"

      - name: Install Capacitor CLI Globally
        run: npm install -g @capacitor/cli

      - name: Create assets folder
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexfix-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
